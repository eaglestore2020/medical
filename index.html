<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b192c">
  <title>إيجل للمستلزمات الطبية | الكتالوج والدليل الطبي</title>
  <link id="pwa-manifest" rel="manifest" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --bg-dark: #081220;
      --card-bg: #102036;
      --border-color: rgba(14, 165, 233, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 110px;
    }

    header {
      background: linear-gradient(135deg, #0b192c 0%, #112a46 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .store-title {
      font-size: 18px;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .store-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .price-mode-switch {
      display: flex;
      background: #081220;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 10px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-btn.active-retail {
      background: var(--primary);
      color: #081220;
    }

    .mode-btn.active-wholesale {
      background: var(--gold);
      color: #081220;
    }

    .rx-banner {
      background: linear-gradient(90deg, rgba(34, 197, 94, 0.16), rgba(14, 165, 233, 0.16));
      border: 1px dashed rgba(74, 222, 128, 0.5);
      border-radius: 11px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      cursor: pointer;
    }

    .rx-banner strong {
      color: #4ade80;
    }

    .search-box {
      position: relative;
      margin-bottom: 9px;
    }

    .search-input {
      width: 100%;
      background: #081220;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 9px 36px 9px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }

    .categories-bar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
      padding: 4px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #081220;
      border-color: var(--primary);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 12px 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .product-card.out-of-stock {
      opacity: 0.55;
    }

    .prod-body {
      display: flex;
      align-items: center;
      gap: 11px;
      flex: 1;
    }

    .prod-img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #081220;
      flex-shrink: 0;
    }

    .prod-info {
      flex: 1;
    }

    .prod-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .prod-cat {
      font-size: 10px;
      background: rgba(14, 165, 233, 0.15);
      color: #7dd3fc;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
    }

    .prod-status {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .status-in { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .status-out { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .prod-name {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
    }

    .prod-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .prod-price {
      font-size: 15px;
      font-weight: 900;
      color: #38bdf8;
    }

    .prod-price.wholesale {
      color: #fbbf24;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #081220;
      padding: 5px 7px;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .qty-btn {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: #081220;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .qty-btn.minus {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .qty-val {
      font-size: 13.5px;
      font-weight: 800;
      min-width: 18px;
      text-align: center;
    }

    .dir-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dir-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      margin-bottom: 4px;
    }

    .dir-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .dir-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .dir-hours {
      font-size: 11.5px;
      color: #7dd3fc;
      margin-top: 3px;
      font-weight: 600;
    }

    .dir-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .call-btn {
      background: var(--success);
      color: #052e16;
      text-decoration: none;
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .wa-dir-btn {
      background: rgba(14, 165, 233, 0.18);
      border: 1px solid var(--primary);
      color: #7dd3fc;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .cart-bar {
      position: fixed;
      bottom: 58px;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
      color: #081220;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.45);
      cursor: pointer;
    }

    .cart-summary { font-weight: 800; font-size: 13.5px; }
    .cart-action {
      background: #081220;
      color: #fff;
      padding: 6px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 800;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: #0b192c;
      border-top: 1px solid var(--border-color);
      display: flex;
      z-index: 35;
    }

    .nav-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .nav-tab.active {
      color: #38bdf8;
      background: rgba(14, 165, 233, 0.08);
      border-top: 2px solid #38bdf8;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-sheet {
      background: #102036;
      border-top: 2px solid var(--primary);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 550px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px 18px 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .close-modal {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }

    .order-input {
      width: 100%;
      background: #081220;
      border: 1px solid var(--border-color);
      border-radius: 11px;
      padding: 11px 14px;
      color: #fff;
      font-size: 13.5px;
      margin-top: 10px;
      outline: none;
    }

    .send-wa-order-btn {
      width: 100%;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      border: none;
      border-radius: 13px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      margin-top: 14px;
      cursor: pointer;
    }

    .hidden { display: none !important; }
    .loader { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

    <div class="header-top">
      <div>
