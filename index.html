<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <title>إيجل للمستلزمات الطبية | الكتالوج والدليل الطبي والخدمات</title>

  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --bg-dark: #081220;
      --card-bg: #102036;
      --border-color: rgba(14, 165, 233, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 110px;
    }

    header {
      background: linear-gradient(135deg, #0b192c 0%, #112a46 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .store-title {
      font-size: 18px;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .store-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .price-mode-switch {
      display: flex;
      background: #081220;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 10px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-btn.active-retail {
      background: var(--primary);
      color: #081220;
    }

    .mode-btn.active-wholesale {
      background: var(--gold);
      color: #081220;
    }

    .rx-banner {
      background: linear-gradient(90deg, rgba(34, 197, 94, 0.16), rgba(14, 165, 233, 0.16));
      border: 1px dashed rgba(74, 222, 128, 0.5);
      border-radius: 11px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      cursor: pointer;
    }

    .rx-banner strong {
      color: #4ade80;
    }

    .search-box {
      position: relative;
      margin-bottom: 9px;
    }

    .search-input {
      width: 100%;
      background: #081220;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 9px 36px 9px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }
